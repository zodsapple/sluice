name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/sluice_etl-0.1.0-py3-none-any.whl
      - name: Installed-package quickstart (outside source directory)
        working-directory: ${{ runner.temp }}
        run: |
          sluice demo --out quickstart
          sluice run quickstart/spec.yaml quickstart/input.csv --out quickstart/output
          sluice prepare quickstart/input.csv --schema quickstart/schema.json --work quickstart/work
          sluice review quickstart/work
          sluice approve quickstart/work --by ci --reason "Reviewed the included synthetic example"
          sluice convert quickstart/work --out quickstart/reviewed-output
