[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sluice-etl"
version = "0.1.0"
description = "Spec-driven Excel/CSV conversion with reconciliation and review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "zodsapple"}]
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4", "pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
llm = ["requests>=2.28,<3"]
xls = ["xlrd>=2,<3"]
dev = ["pytest>=8,<10", "build>=1", "hatchling>=1.27"]

[project.scripts]
sluice = "sluice.cli:main"

[project.urls]
Repository = "https://github.com/zodsapple/sluice"
Issues = "https://github.com/zodsapple/sluice/issues"

[tool.hatch.build.targets.wheel]
packages = ["sluice"]
exclude = ["sluice/tests"]

[tool.hatch.build.targets.sdist]
include = ["/sluice", "/benchmark", "/docs", "/scripts", "/sites", "/.github", "/README.md", "/LICENSE", "/pyproject.toml", "/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["sluice/tests"]
