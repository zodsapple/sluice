name: pharmacy_monthly_landing
workflow: generic
description: NHSBSA monthly prescription cost analysis. IDs stay text; quantity is only meaningful with its unit.
locate:
  header: 0
map:
  YEAR_MONTH:
    to: YEAR_MONTH
    required: true
  BNF_PRESENTATION_CODE:
    to: BNF_PRESENTATION_CODE
    required: true
shape: []
keys:
  cols:
  - YEAR_MONTH
  - REGION_NAME
  - REGION_CODE
  - ICB_NAME
  - ICB_CODE
  - DISPENSER_ACCOUNT_TYPE
  - BNF_PRESENTATION_CODE
  - BNF_PRESENTATION_NAME
  - SNOMED_CODE
  - SUPPLIER_NAME
  - UNIT_OF_MEASURE
  - GENERIC_BNF_EQUIVALENT_CODE
  - GENERIC_BNF_EQUIVALENT_NAME
  - BNF_CHEMICAL_SUBSTANCE_CODE
  - BNF_CHEMICAL_SUBSTANCE
  - BNF_PARAGRAPH_CODE
  - BNF_PARAGRAPH
  - BNF_SECTION_CODE
  - BNF_SECTION
  - BNF_CHAPTER_CODE
  - BNF_CHAPTER
  - PREP_CLASS
  - PRESCRIBED_PREP_CLASS
  - PHARMACY_ADVANCED_SERVICE
  nullable:
  - SNOMED_CODE
  - SUPPLIER_NAME
template:
  filename: 03_pharmacy_landing.csv
  columns:
    YEAR_MONTH: YEAR_MONTH
    REGION_NAME: REGION_NAME
    REGION_CODE: REGION_CODE
    ICB_NAME: ICB_NAME
    ICB_CODE: ICB_CODE
    DISPENSER_ACCOUNT_TYPE: DISPENSER_ACCOUNT_TYPE
    BNF_PRESENTATION_CODE: BNF_PRESENTATION_CODE
    BNF_PRESENTATION_NAME: BNF_PRESENTATION_NAME
    SNOMED_CODE: SNOMED_CODE
    SUPPLIER_NAME: SUPPLIER_NAME
    UNIT_OF_MEASURE: UNIT_OF_MEASURE
    GENERIC_BNF_EQUIVALENT_CODE: GENERIC_BNF_EQUIVALENT_CODE
    GENERIC_BNF_EQUIVALENT_NAME: GENERIC_BNF_EQUIVALENT_NAME
    BNF_CHEMICAL_SUBSTANCE_CODE: BNF_CHEMICAL_SUBSTANCE_CODE
    BNF_CHEMICAL_SUBSTANCE: BNF_CHEMICAL_SUBSTANCE
    BNF_PARAGRAPH_CODE: BNF_PARAGRAPH_CODE
    BNF_PARAGRAPH: BNF_PARAGRAPH
    BNF_SECTION_CODE: BNF_SECTION_CODE
    BNF_SECTION: BNF_SECTION
    BNF_CHAPTER_CODE: BNF_CHAPTER_CODE
    BNF_CHAPTER: BNF_CHAPTER
    PREP_CLASS: PREP_CLASS
