    PHARMACY_ADVANCED_SERVICE: PHARMACY_ADVANCED_SERVICE
    ITEMS:
      col: ITEMS
      type: int
    TOTAL_QUANTITY:
      col: TOTAL_QUANTITY
      type: number
    NIC:
      col: NIC
      type: number
